<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">

<style>
:root{--bg:#f1f1ea;--paper:#fcfcf7;--ink:#253632;--muted:#68766f;--line:#d7ded5;--accent:#2e756d;--warm:#a17c43;--error:#b45343;--metal:#b7c7bb;--side:#8ea49a;--face:#d9e2d7;--slot:#536d63;--shadow:rgba(45,64,49,.1);color-scheme:light}
[data-theme=dark]{--bg:#18201e;--paper:#202b27;--ink:#e3ebe3;--muted:#a4b9ac;--line:#42564b;--accent:#80beb0;--warm:#d6ad71;--error:#eb9685;--metal:#506d5d;--side:#334f40;--face:#6a8774;--slot:#17291e;--shadow:rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}button,input{font:inherit}button,.file-label{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:7px;padding:8px 12px;cursor:pointer;min-height:42px}button:hover,.file-label:hover{border-color:var(--accent);background:var(--bg)}button:focus-visible,a:focus-visible,input:focus-visible,[role=button]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:default}a{color:var(--accent);text-underline-offset:3px}p{margin:0 0 12px}h1,h2,h3{line-height:1.25;margin:0}h1{font-size:clamp(27px,3vw,42px);font-weight:600;letter-spacing:-.035em}h2{font-size:20px;font-weight:600}h3{font-size:13px;margin:22px 0 8px;color:var(--muted)}small,.muted{color:var(--muted)}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:12px;letter-spacing:.06em}.app{max-width:1570px;margin:auto;padding:32px 38px 26px}.intro{display:flex;justify-content:space-between;gap:32px;align-items:start;margin-bottom:26px}.eyebrow{color:var(--accent);margin-bottom:10px;font-size:11px;letter-spacing:.18em}.summary{max-width:790px;color:var(--muted);margin-top:14px;font-size:15px}.tools{display:flex;gap:8px;flex-shrink:0;align-items:center;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:4px;padding:3px 7px;font-size:11px;margin:12px 6px 0 0}.badge:before{content:"";height:5px;width:5px;background:var(--accent);border-radius:50%}.notice{font-size:13px;padding:10px 14px;border:1px solid var(--line);border-left:3px solid var(--warm);background:var(--paper);margin:0 0 18px;overflow-wrap:anywhere}.notice:empty{display:none}.notice.error{border-left-color:var(--error)}.domains{display:flex;gap:10px;margin:0 0 18px;flex-wrap:wrap}.domain{flex:1;min-width:160px;text-align:left;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:3px 10px}.domain strong{font-size:14px}.domain small{font-size:11px;grid-column:1/3;line-height:1.5}.domain span{font-family:ui-monospace,monospace;color:var(--accent);font-size:12px}.domain[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(310px,1fr);gap:18px;align-items:start}.figure,.inspector{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}.figure-head{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:12px}.crumbs{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.crumbs button{padding:2px 5px;min-height:30px;border-color:transparent;border-radius:3px;font-size:12px}.figure-controls{display:flex;gap:4px;flex-shrink:0}.figure-controls button{padding:4px 10px;min-height:32px;font-size:12px}.viewport{overflow:auto;min-height:360px;scrollbar-color:var(--line) transparent}.scene{display:block;width:100%;height:auto;min-width:350px;user-select:none}.scene text{fill:var(--ink);font-family:inherit}.station{cursor:pointer;outline:none}.station .selection-ring{fill:none;stroke:transparent;stroke-width:2}.station.selected .selection-ring,.station:focus-visible .selection-ring{stroke:var(--accent)}.station .status-led{fill:var(--line);stroke:var(--slot);stroke-width:1}.station[data-state=running] .status-led{fill:var(--accent)}.station[data-state=error] .status-led{fill:var(--error)}.station[data-state=ok] .status-led{fill:var(--accent);opacity:.6}.station[data-state=running] .working-part{fill:var(--accent)}.station .label{font-size:15px;font-weight:550}.station .sub-label{font-size:10px;fill:var(--muted)}.edge{fill:none;stroke:var(--line);stroke-width:4;stroke-linecap:round}.edge.control{stroke-dasharray:6 6}.edge.active{stroke:var(--warm)}.packet{fill:var(--warm);stroke:var(--paper);stroke-width:2;pointer-events:none}.legend{padding:6px 20px 12px;display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--muted)}.legend i{display:inline-block;width:7px;height:7px;background:var(--accent);border-radius:50%;margin-right:5px}.legend .err{background:var(--error)}.legend .data{background:var(--warm)}.playback{border-top:1px solid var(--line);padding:17px 20px}.step-heading{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}.step-heading strong{font-size:14px}.step-heading span{color:var(--accent);font-family:ui-monospace,monospace;font-size:12px}.step-description{color:var(--muted);font-size:13px;min-height:42px;margin:0 0 14px}.transport{display:flex;align-items:center;gap:8px}.transport button{padding:6px 10px;min-width:38px}.transport .primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}.transport input{accent-color:var(--accent);min-width:70px;flex:1}.key-hint{font-size:10px;margin:10px 0 0;color:var(--muted)}.inspector{position:sticky;top:18px}.tabs{display:flex;border-bottom:1px solid var(--line);padding:8px 12px 0;gap:8px}.tabs button{background:none;border:0;border-radius:0;border-bottom:2px solid transparent;padding:10px 6px;font-size:12px}.tabs button[aria-selected=true]{border-bottom-color:var(--accent);color:var(--accent)}.detail{padding:23px 24px 25px;max-height:790px;overflow:auto;overflow-wrap:anywhere}.detail .description{color:var(--muted);font-size:13px;margin:12px 0}.detail .evidence{font-size:10px;letter-spacing:.08em;color:var(--accent);margin-bottom:8px}.io{display:grid;grid-template-columns:1fr 1fr;gap:12px}.io-box{border-top:1px solid var(--line);padding-top:8px}.io-box strong{font-size:11px;color:var(--muted);font-weight:500}.io-box ul{margin:6px 0 0;padding-left:15px;font-size:12px}.behaviour{font-size:13px;border-left:2px solid var(--accent);padding-left:10px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.metric{padding:10px 0;border-top:1px solid var(--line)}.metric strong{display:block;font-size:21px;font-weight:500;line-height:1.4}.metric span{font-size:11px;color:var(--muted)}.fine-print{font-size:10px;color:var(--muted);line-height:1.7}.action{width:100%;text-align:left;margin-top:12px;display:flex;justify-content:space-between}.link-row{display:block;padding:10px 0;border-top:1px solid var(--line);font-size:12px}.link-row small{display:block;overflow-wrap:anywhere}.span-row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:9px 0;background:none;font-size:12px;min-height:42px}.span-row strong{display:block;font-weight:500}.span-row small{font-size:10px}.span-row.error strong{color:var(--error)}.span-bar{display:block;width:100%;height:4px;background:var(--bg);border-radius:2px;position:relative;margin-top:6px}.span-bar i{position:absolute;min-width:2px;height:100%;background:var(--accent);border-radius:2px}.span-row.error .span-bar i{background:var(--error)}.span-attrs{white-space:pre-wrap;font-size:11px;line-height:1.7;background:var(--bg);padding:12px;border-radius:5px;max-height:300px;overflow:auto;overflow-wrap:anywhere}.relations{font-size:12px;margin:0;padding-left:15px}.relations li{padding:4px 0}.filter-errors{width:100%;margin:12px 0;text-align:left}.filter-errors[aria-pressed=true]{color:var(--error);border-color:var(--error)}footer{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-top:18px}.file-input{position:absolute;width:1px;height:1px;opacity:0}.file-label:focus-within{outline:3px solid var(--accent)}[hidden]{display:none!important}.figure:fullscreen{background:var(--paper);overflow:auto}.figure:fullscreen .viewport{height:calc(100vh - 230px)}.figure:fullscreen .scene{height:100%;width:auto;margin:auto}@media(min-width:1500px){.detail{max-height:930px}}@media(max-width:1000px){.app{padding:24px 20px}.intro{gap:15px}.layout{grid-template-columns:minmax(0,1.5fr) minmax(290px,1fr)}}@media(max-width:760px){.app{padding:22px 14px}.intro{display:block}.tools{margin-top:14px}.summary{font-size:13px}.layout{grid-template-columns:1fr}.inspector{position:static}.detail{max-height:none;padding:20px}.domain{min-width:140px;padding:10px}.domains{gap:8px}.figure-head{padding:10px}.figure-controls{gap:2px}.figure-controls button{padding:3px 7px}.viewport{min-height:240px}.scene{min-width:350px}.playback{padding:14px}.legend{padding:8px 14px;font-size:10px;gap:12px}.transport{gap:5px}.transport button{padding:5px 8px}.step-description{min-height:0}.domain strong{font-size:12px}.notice{font-size:11px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
.domain-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:0 0 10px;font-size:12px}.domain-controls select,.record-filters input{color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:8px;min-height:40px;max-width:100%}.domain-load{position:relative;padding-bottom:6px}.domain-load i{display:block;height:3px;background:var(--accent);margin-top:4px}.domain-activity{font-variant-numeric:tabular-nums}.domain-activity[data-active=true]{color:var(--accent);font-weight:600}.record-filters{display:grid;gap:8px;margin:14px 0;grid-template-columns:1fr 1fr}.record-filters label{grid-column:1/-1;font-size:11px;color:var(--muted)}.record-filters input{display:block;width:100%;margin-top:4px;font-size:12px}.pagination{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;margin:12px 0}.pagination button{font-size:11px;padding:6px}.raw-record{font-size:12px;margin-top:16px}.raw-record summary{cursor:pointer;min-height:40px}.error-message{color:var(--error)}.state-table{width:100%;border-collapse:collapse;font-size:12px}.state-table th,.state-table td{border-bottom:1px solid var(--line);text-align:left;padding:6px}.state-table th{font-weight:400;color:var(--muted)}.mechanical-readout{fill:var(--accent)!important}.station[data-action=reject] .selection-ring,.station[data-action=error] .selection-ring{stroke:var(--error);stroke-dasharray:4 4}
.station[data-state=error] .mechanical-readout{fill:var(--error)!important}
</style>
</head>
<body data-theme="light">
<div class="app">
<header class="intro">
<div><div class="eyebrow mono">AGENT ANATOMY · MECHANISMS EXPLAINED</div><h1 id="title"></h1><p class="summary" id="summary"></p><span class="badge" id="mode-badge"></span><span class="badge">离线 SVG · 2.5D</span></div>
<div class="tools"><button id="example-trace" hidden>体验 Trace</button><label class="file-label">导入 Trace<input class="file-input" id="trace-file" type="file" accept=".json,.jsonl,.trace,application/json" aria-label="导入本地 Trace 文件"></label><button id="restore" hidden>恢复示例</button><button id="theme" aria-label="切换深浅主题">深色</button></div>
</header>
<div id="notice" class="notice" role="status" aria-live="polite"></div>
<div class="domain-controls"><label>业务域比较 <select id="domain-metric"><option value="count">记录量</option><option value="cumulativeMs">累计耗时</option><option value="errors">错误数</option><option value="tokens">已记录 token</option></select></label><small>条形比较当前文件的全量记录；活动随回放变化。累计耗时包含重叠。</small></div>
<nav id="domains" class="domains" aria-label="业务域筛选"></nav>
<main class="layout">
<section class="figure" id="figure" aria-label="机械解剖与回放">
<div class="figure-head"><nav id="crumbs" class="crumbs" aria-label="层级路径"></nav><div class="figure-controls"><button id="zoom-out" aria-label="缩小图形">−</button><button id="zoom-in" aria-label="放大图形">＋</button><button id="fit">适配</button><button id="fullscreen">全屏</button></div></div>
<div class="viewport" id="viewport"><svg id="scene" class="scene" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="点击机械部件查看详情"></svg></div>
<div class="legend"><span><i></i>当前活动</span><span><i class="data"></i>合成数据流</span><span><i class="err"></i>已记录错误</span><span>点击部件 · 可进入内部</span></div>
<div class="playback"><div class="step-heading"><strong id="step-title"></strong><span id="position"></span></div><p class="step-description" id="step-description"></p><div class="transport"><button id="back" aria-label="上一步">‹</button><button id="play" class="primary">播放</button><button id="next" aria-label="下一步">›</button><input id="scrubber" type="range" min="0" max="1" value="0" step="1" aria-label="回放位置"></div><p class="key-hint">图形中可用 Tab 选择部件，Enter 查看；方向键调整回放，Esc 返回。</p></div>
</section>
<aside class="inspector" aria-label="部件与记录详情"><div class="tabs" role="tablist" aria-label="详情类型"><button id="tab-component" role="tab" aria-selected="true" aria-controls="detail">部件</button><button id="tab-trace" role="tab" aria-selected="false" aria-controls="detail">执行记录</button><button id="tab-source" role="tab" aria-selected="false" aria-controls="detail">来源与口径</button></div><div id="detail" class="detail" role="tabpanel" aria-labelledby="tab-component"></div></aside>
</main>
<footer><span>ANATOMY / v1.0.0 · 一个状态模型驱动图形与读数</span><span id="footer-note">合成演示；没有实际性能数据。</span></footer>
</div>
<script id="anatomy-model" type="application/json">__DATA__</script>
<script>
__SCRIPT__
</script>
</body>
</html>
